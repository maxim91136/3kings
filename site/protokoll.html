<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#0F1218">
<title>3Kings · Protokoll</title>
<style>
:root{--ink:#0F1218;--line:#262B37;--text:#E9E4D8;--mute:#8A8F9C;--gld:#D9B34A;
--serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;--sans:system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}html{color-scheme:dark}
body{margin:0;background:var(--ink);color:var(--text);font:15px/1.6 var(--sans);-webkit-font-smoothing:antialiased;
padding:max(22px,env(safe-area-inset-top)) 18px max(40px,env(safe-area-inset-bottom))}
main{max-width:720px;margin:0 auto}
a{color:var(--gld)}
.back{display:inline-block;margin-bottom:18px;font-size:14px;text-decoration:none}
h1{font:600 36px/1.15 var(--serif);margin:0 0 6px}
.lead{color:var(--mute);font-size:14px;margin:0 0 28px}
h2{font:500 22px/1.25 var(--serif);margin:36px 0 8px;padding-top:18px;border-top:1px solid var(--line)}
h3{font:600 16px/1.3 var(--sans);margin:22px 0 6px}
p,li{color:#D6D1C5}ul{padding-left:20px}
code{font-size:13px;background:#171B24;padding:1px 5px;border-radius:3px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.top .back{margin:0}.lang{display:flex;gap:2px;font-size:12px}.lang a{color:var(--mute);text-decoration:none;padding:4px 8px;border:1px solid var(--line);border-radius:4px}.lang a.on{color:var(--ink);background:var(--gld);border-color:var(--gld)}
</style></head><body><main>
<div class="top"><a class="back" id="back" href="./">← Zurück zur Übersicht</a><span class="lang"><a href="?lang=de" id="lde">DE</a><a href="?lang=en" id="len">EN</a></span></div>
<h1 id="ttl">Protokoll</h1>
<p class="lead" id="lead">Jede Entscheidung, jeder Test und jede Änderung mit Datum. Was heute gilt, steht im <a href="regeln.html" id="rb">Regelbuch</a>.</p>
<div id="doc">…</div>
</main>
<script>
const qs=new URLSearchParams(location.search);let LANG=qs.get("lang")||(()=>{try{return localStorage.getItem("lang")}catch(e){return null}})()||(navigator.language||"de").slice(0,2);if(LANG!=="en")LANG="de";try{localStorage.setItem("lang",LANG)}catch(e){}
const EN=LANG==="en";setTimeout(()=>{const a=document.getElementById("rb");if(a)a.href="regeln.html?lang="+LANG},0);document.documentElement.lang=LANG;document.getElementById(EN?"len":"lde").className="on";document.getElementById("back").href="./?lang="+LANG;
if(EN){document.title="3Kings · Log";document.getElementById("back").textContent="← Back to overview";document.getElementById("ttl").textContent="Log";document.getElementById("lead").innerHTML='Every decision, test and change with its date. What applies today is in the <a href="regeln.html?lang=en">rule book</a>.'}
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const inl=s=>esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`(.+?)`/g,"<code>$1</code>")
 .replace(/\b(\d+)\.(\d+)\b/g,EN?"$1.$2":"$1,$2");
function md(t){let o="",list=false,para=[];
 const fp=()=>{if(para.length){o+="<p>"+inl(para.join(" "))+"</p>";para=[]}};
 const fl=()=>{if(list){o+="</ul>";list=false}};
 for(const raw of t.split("\n")){const l=raw.trimEnd();
  if(!l.trim()){fp();fl();continue}
  let m;
  if(m=l.match(/^(#{1,3})\s+(.*)/)){fp();fl();const n=m[1].length;
   if(n===1)continue;o+=`<h${n}>${inl(m[2])}</h${n}>`;continue}
  if(m=l.match(/^\s*[-*]\s+(.*)/)){fp();if(!list){o+="<ul>";list=true}o+="<li>"+inl(m[1])+"</li>";continue}
  if(list&&/^\s{2,}/.test(raw)){o=o.replace(/<\/li>$/," "+inl(l.trim())+"</li>");continue}
  fl();para.push(l.trim())}
 fp();fl();return o}
fetch(EN?"REGELN.en.md":"REGELN.md",{cache:"no-store"}).then(r=>r.text()).then(t=>{
 const parts=t.split(/\n(?=## )/),head=parts.shift(),secs=parts.reverse();   // neueste Einträge zuerst
 const last=(secs[0]||"").match(/^## (\d{4}-\d{2}-\d{2})/);
 document.getElementById("doc").innerHTML=`<h2 style="border-top:0;padding-top:0;margin-top:0">${EN?"Preface":"Vorbemerkung"}</h2>`+md(head)+(last?`<h2>${EN?"Entries, newest first":"Einträge, neueste zuerst"}</h2><p class="lead" style="margin:0 0 8px">${EN?"Latest entry: ":"Letzter Eintrag: "}${last[1].split("-").reverse().join(".")}</p>`:"")+md(secs.join("\n"))})
 .catch(()=>{document.getElementById("doc").textContent=EN?"Rule book could not be loaded.":"Regelbuch konnte nicht geladen werden."});
</script></body></html>
