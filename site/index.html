/* Jokerlachen 2026-11-22 */
.joker{display:block;width:max-content;max-width:92%;margin:10px auto 2px;font:400 17px/1.25 var(--display);color:#E0473C;transform:rotate(-3deg);text-shadow:0 0 1px rgba(224,71,60,.4)}

.capbtn:focus-visible{outline:2px solid var(--gld);outline-offset:4px;border-radius:12px}
.capbtn .haha{position:absolute;right:86%;top:6px;font:400 26px/1 var(--display);color:#E0473C;white-space:nowrap;opacity:0;transform:rotate(-12deg) scale(.6);pointer-events:none;transform-origin:right center}

<p><b>Forschung.</b> Wir forschen und stellen Fragen. Bevor wir rechnen, legen wir die Regeln fest und schreiben sie ins Protokoll. Danach berichten wir, was herauskam, auch wenn es unbequem ist oder das Muster nicht gehalten hat. Wir blenden nichts aus, nur weil es uns nicht gefällt. Die ganze Wahrheit bekommen wir nie, aber wir sagen offen, wie weit die Daten tragen und wo sie aufhören. Alles ist der Blick zurück, kein Beleg für die Zukunft. Auch ein Versuch, einen Krypto-Bot zu bauen, der den S&amp;P 500 schlägt, endete beim S&amp;P 500 (von außen übernommen, hier nicht nachgerechnet, siehe Protokoll). Den Heiligen Gral haben wir dort nicht gefunden. Das heißt nicht, dass es ihn nicht gibt.</p> <p><b>Der Joker.</b> Drei Könige regieren, der Joker prüft sie. Die Tests sind der Joker: Sie sagen auch Unbequemes, etwa dass Warten auf Rücksetzer in keinem Test besser war als sofort kaufen.</p>

<p><b>The idea.</b> A private lab for three assets: the S&amp;P 500 as the foundation, bitcoin and gold as satellites. Nothing is guessed here, everything is measured.</p>
<p><b>Rules first, then compute.</b> Every rule and hypothesis is fixed before the result is known and written to the <a href="protokoll.html?lang=${LANG}" style="color:var(--gld)">log</a> with a date. What currently applies is in the <a href="regeln.html?lang=${LANG}" style="color:var(--gld)">rule book</a>. Changes happen only by explicit decision. That makes it impossible to massage the numbers.</p>
