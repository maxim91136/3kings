/* Hofnarr-Design 2026-11-22 */
:root{--ink:#120D17;--slate:#1B1422;--line:#2E2338;--text:#EDE6D6;--mute:#B3A9BF;--ok:#8BC26A;--warn:#E2B04A;--bad:#EE6B5E;--gld:#D9A63B;--violet:#7B4BB8;--jgreen:#8BC26A;
--display:"Permanent Marker","Comic Sans MS",cursive;--title:"Rubik Wet Paint","Permanent Marker",cursive;--serif:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--sans:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
body{background:var(--ink)}a{color:#C9A6F2}a:hover{color:#E4D2FA}
.totop{background:rgba(18,13,23,.92);color:var(--gld)}
h1{font-family:var(--display);font-weight:400;letter-spacing:.01em}
h2{font-family:var(--display);font-weight:400;font-size:30px}
h1{font-family:var(--title);font-size:60px;line-height:1;margin:4px 0 6px}@media(min-width:560px){h1{font-size:76px}}
h4{font:400 27px/1.15 var(--display);letter-spacing:.01em}
summary{font:400 24px/1.25 var(--display)}details.more>summary{font:500 14px/1.4 var(--sans);color:var(--gld)}
.verdict h2{font-family:var(--display);font-weight:400}.verdict.hero h2{font-size:52px;letter-spacing:0}.verdict.hero h2.buy{color:var(--jgreen)}
.kj{color:var(--gld)}.kj h3{font:400 42px/1.05 var(--display);letter-spacing:.01em}
.grp-h{font:400 30px/1 var(--display);letter-spacing:.02em;color:var(--gld);display:flex;align-items:center;justify-content:center;gap:12px;margin:80px 0 -12px}
.grp-h svg{width:26px;height:36px;flex:none}
.crown{width:84px;height:84px;color:inherit;display:block;margin:0 auto -6px}
.sub{color:var(--jgreen);letter-spacing:.04em;font-weight:600}

/* Narren-Atmosphäre 2026-11-22 */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(70% 45% at 0% 0%,rgba(123,75,184,.28),transparent 70%),radial-gradient(60% 40% at 100% 100%,rgba(139,194,106,.12),transparent 70%),radial-gradient(40% 30% at 100% 10%,rgba(123,75,184,.14),transparent 70%)}
body{background:#120D17}
.sticker{box-shadow:3px 3px 0 #7B4BB8}

/* Narrenlachen 2026-11-22 */
.narr{display:block;width:max-content;max-width:92%;margin:10px auto 2px;font:400 17px/1.25 var(--display);color:#E0473C;transform:rotate(-3deg);text-shadow:0 0 1px rgba(224,71,60,.4)}
.narr.r{transform:rotate(2.5deg);margin-left:auto;margin-right:4%}
.capbtn{background:none;border:0;padding:0;margin:0 auto;display:block;cursor:pointer;position:relative;-webkit-tap-highlight-color:transparent}
.capbtn:focus-visible{outline:2px solid var(--gld);outline-offset:4px;border-radius:12px}
.capbtn .haha{position:absolute;right:86%;top:6px;font:400 26px/1 var(--display);color:#E0473C;white-space:nowrap;opacity:0;transform:rotate(-12deg) scale(.6);pointer-events:none;transform-origin:right center}
.capbtn.laugh .crown{animation:jingle .6s ease-in-out}
.capbtn.laugh .haha{animation:haha 1.6s ease-out}
@keyframes jingle{0%,100%{transform:rotate(0)}20%{transform:rotate(-12deg)}40%{transform:rotate(10deg)}60%{transform:rotate(-7deg)}80%{transform:rotate(4deg)}}
@keyframes haha{0%{opacity:0;transform:rotate(-12deg) scale(.6)}15%{opacity:1;transform:rotate(-12deg) scale(1.1)}70%{opacity:1}100%{opacity:0;transform:rotate(-12deg) translateY(-14px) scale(1)}}
@media(prefers-reduced-motion:reduce){.capbtn.laugh .crown{animation:none}.capbtn.laugh .haha{animation:none;opacity:1}}
.hahafoot{margin-top:18px;font:400 15px/1 var(--display);color:#5A2420;letter-spacing:.35em;text-align:center;user-select:none}
