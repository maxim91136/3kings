<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>3Kings</title>
<style>
:root{--ink:#0F1218;--slate:#171B24;--line:#262B37;--text:#E9E4D8;--mute:#8A8F9C;
--btc:#E58A3A;--spy:#6C8FD6;--gld:#D9B34A;--ok:#6FBF8E;--warn:#E8A33D;--bad:#E26D5C;
--serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;--sans:system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;background:var(--ink);color:var(--text);font:16px/1.5 var(--sans);-webkit-font-smoothing:antialiased;
padding:max(22px,env(safe-area-inset-top)) 18px max(40px,env(safe-area-inset-bottom))}
main{max-width:720px;margin:0 auto;text-align:center}
.crown{width:34px;height:26px;color:var(--gld)}
h1{font:600 40px/1.1 var(--serif);letter-spacing:.01em;margin:6px 0 6px}
.stamp{color:var(--mute);font-size:13px}
.alert{margin:18px 0 0;padding:12px 14px;border:1px solid var(--bad);border-radius:6px;color:#F3C4BC;background:#2A1512;text-align:left;font-size:14px}
.verdict{margin:34px 0 8px}
.verdict h2{font:500 34px/1.15 var(--serif);margin:0}
.verdict p{margin:6px 0 0;color:var(--mute);font-size:14px}
.verdict.act h2{color:var(--warn)}.verdict.hero{margin:30px 0 0}.verdict.hero h2{font-size:56px;letter-spacing:-.01em}.verdict.hero h2.buy{color:#7FD39A}.verdict.hero h2.wait{color:var(--gld)}.verdict.small{margin:20px 0 8px}.verdict.small h2{font-size:24px}section.first{margin-top:22px}table.pf{margin:14px 0}table.pf td:last-child{color:var(--mute)}table.pf td{font-size:13px;line-height:1.4;padding:9px 4px}table.pf th{font-size:12px}section.pruef{margin-top:64px;padding-top:28px;border-top:1px solid var(--line)}.money label{min-width:8.5em;text-align:right}
.banners{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:26px 0 0}
.banner{display:flex;flex-direction:column;align-items:center;gap:8px}
.banner h3{font:600 15px/1.2 var(--sans);margin:0;color:var(--text)}
.pole{position:relative;width:100%;height:190px;background:var(--slate);border:1px solid var(--line);
border-radius:3px 3px 36px 36px / 3px 3px 22px 22px;overflow:hidden}
.fill{position:absolute;left:0;right:0;bottom:0;height:0;background:var(--c);opacity:.9;transition:height 1.1s cubic-bezier(.2,.8,.2,1)}
.fill::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,255,255,.14),transparent 30%,transparent 70%,rgba(0,0,0,.18))}
.tick{position:absolute;left:0;right:0;height:0;border-top:2px dashed var(--text);opacity:.8}
.pct{font:600 30px/1 var(--serif)}
.pct small{font-size:16px}
.verb{font-size:14px;line-height:1.3;margin-top:-2px}
.verb.up{color:var(--ok)}.verb.down{color:var(--warn)}.verb.out{color:var(--mute)}
.why{color:var(--mute);font-size:12px;line-height:1.35;max-width:14em;margin-top:-2px}
section{margin-top:44px;text-align:center}
.money{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px;margin:0 0 14px}.money .only{display:flex;align-items:center;gap:6px;font-size:13px}.money .only input{width:auto;padding:0}.money input{width:7.5em;background:var(--slate);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:9px 10px;font:600 18px var(--sans);text-align:right}.money input:focus-visible{outline:2px solid var(--gld);outline-offset:2px}
.split{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}.split div{border-top:2px solid var(--c,var(--line));padding-top:8px}.split b{display:block;font:600 20px var(--serif)}.split span{font-size:12px;color:var(--mute)}.ind{display:grid;grid-template-columns:14px 1fr auto;gap:4px 10px;align-items:baseline;padding:10px 0;border-top:1px solid var(--line);text-align:left}.ind i{width:10px;height:10px;border-radius:50%;display:inline-block;background:#8A8F9C}.ind .gruen{background:#5FBF7A}.ind .gelb{background:#D9B34A}.ind .rot{background:#D9634A}.ind b{font:600 15px var(--sans)}.ind em{font-style:normal;font:600 16px var(--serif);text-align:right}.ind small{grid-column:2/4;color:var(--mute);font-size:12.5px;line-height:1.45}.verdictline{margin:6px 0 12px;font-size:14px;line-height:1.5}.verdictline b{font:600 16px var(--serif)}
.cheap{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}.cheap td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right}.cheap td:first-child{text-align:left}
h4{font:500 22px/1.2 var(--serif);margin:0 0 14px}
.bar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--slate);border:1px solid var(--line)}
.bar i{display:block;height:100%}
.legend{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:13px;color:var(--mute)}
.legend b{color:var(--text);font-weight:600}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.season{height:6px;background:var(--slate);border-radius:3px;overflow:hidden;margin:10px 0 8px}
.season i{display:block;height:100%;background:var(--gld);width:0;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.mute{color:var(--mute);font-size:14px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 16px}
.pair div{border-top:1px solid var(--line);padding-top:10px}
.pair b{display:block;font:600 30px/1.1 var(--serif)}
.pair span{font-size:13px;color:var(--mute)}
svg.chart{width:100%;height:auto;display:block}
.empty{padding:22px 0;color:var(--mute);font-size:14px}
details{margin-top:44px;text-align:left}
summary{cursor:pointer;text-align:center;font:500 22px/1.2 var(--serif);list-style:none;padding:6px 0}
summary::-webkit-details-marker{display:none}
summary::after{content:" ▾";color:var(--mute);font-size:16px}details[open] summary::after{content:" ▴"}
summary:focus-visible{outline:2px solid var(--gld);outline-offset:4px}
table{width:100%;border-collapse:collapse;margin-top:14px;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:7px 4px;text-align:right;border-bottom:1px solid var(--line)}
th{color:var(--mute);font-weight:500}th:first-child,td:first-child{text-align:left}
footer{margin-top:44px;color:var(--mute);font-size:12px}
@media(min-width:560px){.pole{height:230px}.pct{font-size:36px}h1{font-size:48px}}
@media(prefers-reduced-motion:reduce){.fill,.season i{transition:none}}
</style></head><body>
<main id="app"><svg class="crown" viewBox="0 0 24 18" fill="currentColor" aria-hidden="true"><path d="M2 6l5 4 5-8 5 8 5-4-2 11H4z"/></svg>
<h1>3Kings</h1><div class="stamp">lädt …</div></main>
<script>
const pct=x=>Math.round(x*100);
const fmtDay=s=>{const[a,b,c]=s.split("-");return c+"."+b+"."+a};
const KINGS={BTC:{name:"Bitcoin",c:"var(--btc)"},SPY:{name:"S&P 500",c:"var(--spy)"},GLD:{name:"Gold",c:"var(--gld)"}};
const why=v=>v.champion.startsWith("Trend")?(x=>`Kurs ${Math.abs(x)<0.01?(Math.abs(x)*100).toFixed(1).replace(".",","):Math.abs(Math.round(x*100))} % ${x<0?"unter":"über"} dem ${v.line_n||200}-Tage-Schnitt`)(v.vs_line??v.vs_sma200):
 v.champion.startsWith("Vol")?"Anteil nach Schwankung":"voll dabei";
function chart(rows,la="Empfehlungen",lb="Halten"){
 if(rows.length<2) return `<div class="empty">Die Kurve füllt sich mit jedem Lauf.</div>`;
 const W=640,H=220,L=44,R=110,T=14,B=26,xs=rows.map((_,i)=>L+(W-L-R)*i/(rows.length-1));
 const all=rows.flatMap(r=>[+r.shadow,+r.hold]);let lo=Math.min(...all),hi=Math.max(...all);const pad=(hi-lo)*.15||.01;lo-=pad;hi+=pad;
 const y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
 const path=k=>rows.map((r,i)=>(i?"L":"M")+xs[i].toFixed(1)+" "+y(+r[k]).toFixed(1)).join(" ");
 const last=rows[rows.length-1];
 return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Schattenbuch gegen Halten">
 <line x1="${L}" x2="${W-R}" y1="${y(1)}" y2="${y(1)}" stroke="#262B37"/><text x="${L-8}" y="${y(1)+4}" text-anchor="end" fill="#8A8F9C" font-size="12">1,00</text>
 <path d="${path("hold")}" fill="none" stroke="#8A8F9C" stroke-width="2" stroke-dasharray="5 4"/>
 <path d="${path("shadow")}" fill="none" stroke="#D9B34A" stroke-width="2.5"/>
 <text x="${W-R+8}" y="${y(+last.shadow)+4}" fill="#D9B34A" font-size="13">${la}</text>
 <text x="${W-R+8}" y="${y(+last.hold)+(Math.abs(y(+last.shadow)-y(+last.hold))<16?18:4)}" fill="#8A8F9C" font-size="13">${lb}</text>
 <text x="${L}" y="${H-6}" fill="#8A8F9C" font-size="12">${fmtDay(rows[0].date)}</text>
 <text x="${W-R}" y="${H-6}" text-anchor="end" fill="#8A8F9C" font-size="12">${fmtDay(last.date)}</text></svg>`;
}
fetch("heartbeat.json?"+Date.now()).then(r=>r.json()).then(h=>{
 const age=(Date.now()-new Date(h.generated_at))/864e5,dage=(Date.now()-new Date(h.data_date))/864e5;
 const run=new Date(h.generated_at).toLocaleString("de-DE",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
 const mv={};h.moves.forEach(m=>mv[m.player]=m);const act=h.moves.length>0;
 let o=`<svg class="crown" viewBox="0 0 24 18" fill="currentColor" aria-hidden="true"><path d="M2 6l5 4 5-8 5 8 5-4-2 11H4z"/></svg><h1>3Kings</h1>
 <div class="stamp">Kurse vom ${fmtDay(h.data_date)}, berechnet am ${run} Uhr</div>`;
 if(age>3||dage>5) o+=`<div class="alert"><b>Puls ausgefallen.</b> Letzter Lauf vor ${age.toFixed(1)} Tagen, letzter Kurstag ${fmtDay(h.data_date)}. Bitte den GitHub-Lauf prüfen.</div>`;
 o+=`<div class="verdict hero" id="hero"><h2 id="sig">…</h2><p id="sigwhy"></p></div>
 <section class="first"><div class="money"><label for="amt" class="mute">Neues Geld</label><input id="amt" type="number" inputmode="numeric" min="0" step="100" value="1000"><span class="mute">€</span></div>
 <div class="split" id="split"></div><div class="mute" id="note"></div>
 <table class="cheap" id="cheap"></table></section>
 <section class="proof"><h4>Der Beleg</h4>
 <div class="mute">Regel: Neues Kapital sofort investieren. Getestet gegen alle Warte-Strategien mit Daten ab 1929, keine war überlegen.</div>
 <table class="pf"><tr><th>Idee</th><th>Ergebnis</th></tr>
 <tr><td>Auf Rücksetzer warten (−10 %)</td><td>2,18 statt 2,44 pro eingezahltem €</td></tr>
 <tr><td>Nicht am Hoch kaufen</td><td>2–3 % weniger Endvermögen</td></tr>
 <tr><td>Teure Bewertung als Bremse</td><td>2,26 statt 2,43, bis zu 6 Jahre Wartezeit</td></tr>
 <tr><td>Extreme Angst (VIX) als Kaufsignal</td><td>identisch, der Markt war da schon gefallen</td></tr>
 <tr><td>In Stufen einsteigen</td><td>beim S&amp;P in 3 von 6 Epochen besser, zu wenig</td></tr>
 <tr><td>20 % als Reserve für Crashs halten</td><td>2,08 statt 2,14</td></tr>
 <tr><td>Immer in den Stärksten investieren</td><td>kein Vorteil bei S&amp;P und Gold</td></tr><tr><td>Einzelaktien erst 10–25 % unter dem Hoch kaufen</td><td>3–21 % weniger, nur bei jeder 10. Aktie besser (138 Aktien, ab 2006)</td></tr><tr><td>Bitcoin erst 20–60 % unter dem Hoch kaufen</td><td>6–17 % weniger, besser nur in jedem 4. bis 10. Startmonat (ab 2013)</td></tr></table>
 <div class="mute">Einzige belegte Ausnahme: Der Trend (200-Tage-Linie) senkt den schlimmsten Rückgang von 78 auf 22 %. Das gilt fürs Halten, nicht fürs Kaufen.</div>
 <div class="mute" style="margin-top:8px">US-Aktien, Vergangenheit, keine Garantie. Stand 18.11.2026, Details im Regelbuch.</div></section>
 <section id="long" hidden></section>
 <section id="ind" hidden></section>
 <section id="spar" hidden></section>
 <section id="watch" hidden></section>
 <section class="pruef"><h4>Prüfstand: Mannschaft</h4><div class="mute">Taktisches Modell mit allen drei Königen. Ohne Handelsrelevanz, läuft zu Testzwecken mit.</div>`;
 o+=`<div class="verdict small ${act?"act":""}"><h2>${act?"Aktion empfohlen":"Nichts tun"}</h2><p>${act?"Mindestens ein Anteil weicht um "+pct(h.band)+" Punkte oder mehr ab.":"Der Bestand bleibt, keine Abweichung ab "+pct(h.band)+" Punkten."}</p></div><div class="banners">`;
 for(const[k,v]of Object.entries(h.players)){const K=KINGS[k],m=mv[k],held=h.held[k];
  let verb,cls;
  if(m){cls=m.delta>0?"up":"down";verb=(m.delta>0?"aufstocken auf ":"reduzieren auf ")+pct(m.auf)+" %"}
  else if(held===0){cls="out";verb="draußen bleiben"}else{cls="";verb="halten"}
  const tick=m||Math.abs(v.target-held)>=0.01?`<div class="tick" style="bottom:${Math.min(pct(v.target),100)}%"></div>`:"";
  o+=`<div class="banner" style="--c:${K.c}"><h3>${K.name}</h3><div class="pole"><div class="fill" data-h="${Math.min(pct(held),100)}"></div>${tick}</div>
  <div class="pct">${pct(held)}<small> %</small></div><div class="verb ${cls}">${verb}</div><div class="why">${why(v)}</div></div>`}
 o+=`</div><section><h4>Verteilung</h4><div class="bar">${Object.entries(KINGS).map(([k,K])=>`<i style="width:${pct(h.held[k])}%;background:${K.c}"></i>`).join("")}</div>
 <div class="legend">${Object.entries(KINGS).map(([k,K])=>`<span><span class="dot" style="background:${K.c}"></span>${K.name} <b>${pct(h.held[k])} %</b></span>`).join("")}<span><span class="dot" style="background:#262B37;border:1px solid #8A8F9C"></span>Cash <b>${pct(h.cash)} %</b></span></div></section>`;
 o+=`</section>`;
 o+=`<section><h4>Saison ${h.season.n_seasons}</h4><div class="season"><i data-w="${Math.round(h.season.day_in_season/63*100)}"></i></div>
 <div class="mute">Tag ${h.season.day_in_season} von 63. Die nächste Strategie-Wahl kommt in ${h.season.days_left} Handelstagen, bis dahin ändern sich die Regeln nicht.</div></section>
 <section><h4>Schattenbuch Mannschaft</h4><div class="pair"><div><b style="color:var(--gld)">${h.shadow.toFixed(3).replace(".",",")}</b><span>Empfehlungen befolgt</span></div><div><b>${h.hold.toFixed(3).replace(".",",")}</b><span>alle drei gleich halten</span></div></div>
 ${chart(h.ledger_tail)}<div class="mute">Seit ${fmtDay(h.since)}, ${h.n_actions} ${h.n_actions===1?"Empfehlung":"Empfehlungen"}. Papierrechnung, nur Handelskosten sind eingerechnet.</div></section>
 <details><summary>Verlauf</summary><table><tr><th>Tag</th><th>BTC</th><th>S&amp;P</th><th>Gold</th><th>Cash</th><th>Schatten</th></tr>${h.ledger_tail.slice().reverse().slice(0,60).map(r=>`<tr><td>${fmtDay(r.date)}</td><td>${pct(+r.BTC)} %</td><td>${pct(+r.SPY)} %</td><td>${pct(+r.GLD)} %</td><td>${pct(+r.cash)} %</td><td>${(+r.shadow).toFixed(3).replace(".",",")}</td></tr>`).join("")}</table></details>
 <footer>Nur zur privaten Auswertung. Es werden keine Aufträge ausgelöst.</footer>`;
 document.getElementById("app").innerHTML=o;
 const de=(x,d=1)=>Math.abs(x*100).toFixed(d).replace(".",",");
 const go=s=>{const cur=s.currency==="EUR"?"in Euro":"in Dollar";
  const sig=document.getElementById("sig");sig.textContent="Kaufen";sig.className="buy";
  document.getElementById("sigwhy").textContent="Neues Geld sofort in den S&P 500. Warten auf Rücksetzer, Bewertung oder Angst hat in keinem Test etwas gebracht.";
  const amt=document.getElementById("amt");
  const upd=()=>{const a=Math.max(0,+amt.value||0);
   document.getElementById("split").innerHTML=`<div style="--c:var(--spy)"><b>${Math.round(a).toLocaleString("de-DE")} €</b><span>in den S&amp;P 500</span></div>`;
   document.getElementById("split").style.gridTemplateColumns="1fr";
   document.getElementById("note").textContent="Nicht verkaufen, auch nicht im Crash. Bitcoin und Gold nicht nachkaufen."};
  amt.addEventListener("input",upd);upd();
  document.getElementById("cheap").innerHTML=`<tr><td class="mute">Abstand zum Allzeithoch (nur Info)</td><td></td></tr><tr><td>S&amp;P 500 (${s.currency==="EUR"?"Euro":"Dollar"})</td><td>−${de(s.dd_ath)} %</td></tr>`+["BTC","GLD"].map(k=>{const v=s.others?s.others[k]:(h.players[k].dd_ath??h.players[k].dd_high);return `<tr><td>${KINGS[k].name} (${s.others&&s.currency==="EUR"?"Euro":"Dollar"})</td><td>−${de(v)} %</td></tr>`}).join("");
  if(s.rows&&s.rows.length){const p=s.plans,sp=document.getElementById("spar");
   sp.innerHTML=`<h4>Schattenbuch Sparplan</h4><div class="pair"><div><b style="color:var(--spy)">${eur0(p.regel.value)}</b><span>nach Regel</span></div><div><b>${eur0(p.sofort.value)}</b><span>immer sofort</span></div></div>
   ${chart(s.rows.map(r=>({date:r.date,shadow:r.regel/r.paid,hold:r.sofort/r.paid})),"Regel","sofort")}
   <div class="mute">Seit ${fmtDay(s.start)} jeden Monat 100 € virtuell, eingezahlt ${eur0(p.regel.paid)}${p.regel.cash>0?`, davon ${eur0(p.regel.cash)} gerade gesammelt`:""}. Vergleich: Läuft „nicht am Hoch“ (kaufen erst 3 % unter dem Hoch) in Zukunft besser als sofort kaufen? Bisher nicht.</div>`;sp.hidden=false}};
 const eur0=x=>Math.round(x).toLocaleString("de-DE")+" €";
 fetch("spx_long.json",{cache:"no-store"}).then(r=>r.json()).then(j=>{
  const R=j.rows,W=640,H=300,L=46,Rp=14,T=12,B=28,n=R.length,lg=Math.log10;
  const v=R.map(r=>r[1]),lo=lg(Math.min(...v))-.3,hi=lg(Math.max(...v))+.08;
  const x=i=>L+(W-L-Rp)*i/(n-1),y=p=>T+(H-T-B)*(1-(lg(p)-lo)/(hi-lo)),ix=ym=>R.findIndex(r=>r[0]>=ym);
  let g="";
  for(let d=1,k=0;d<1e6;d*=10)if(lg(d)>=lo&&lg(d)<=hi)g+=`<line x1="${L}" x2="${W-Rp}" y1="${y(d)}" y2="${y(d)}" stroke="#262B37"/><text x="${L-8}" y="${y(d)+4}" text-anchor="end" fill="#8A8F9C" font-size="12">${d.toLocaleString("de-DE")}</text>`;
  for(let yr=1930;yr<=2020;yr+=10){const i=ix(yr+"-01");if(i>=0)g+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle" fill="#8A8F9C" font-size="12">${yr}</text>`}
  const C=[["1932-06","−86 %",1929],["1974-09","−48 %",1973],["2002-09","−49 %",2000],["2009-02","−57 %",2008],["2020-03","−34 %",2020]];
  const c=C.map(([m,t,yr])=>{const i=ix(m);return i<0?"":`<circle cx="${x(i)}" cy="${y(v[i])}" r="3" fill="var(--bad)"/><text x="${x(i)}" y="${y(v[i])+18}" text-anchor="middle" fill="var(--bad)" font-size="11.5">${t}</text>`}).join("");
  const path=R.map((r,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(r[1]).toFixed(1)).join(" ");
  const pc=x=>(x*100).toFixed(1).replace(".",",");
  const s=document.getElementById("long");
  s.innerHTML=`<h4>S&amp;P 500 seit 1928</h4><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="S&amp;P 500 seit 1928, logarithmisch">${g}<path d="${path}" fill="none" stroke="var(--spy)" stroke-width="1.8"/>${c}</svg>
   <div class="mute">Kursindex ohne Dividenden, Monatsendwerte, logarithmische Skala: gleicher Abstand bedeutet gleiche prozentuale Veränderung. ${pc(j.cagr)} % pro Jahr ohne Dividenden, mit Dividenden rund 10 %. Rot: größte Rückgänge vom Hoch bis zum Tief. Jeder davon wurde aufgeholt, am längsten dauerte es nach 1929 (Kursindex zurück auf dem Hoch erst 1954). Stand ${fmtDay(j.until)}.</div>`;
  s.hidden=false}).catch(()=>{});
 fetch("watch.json",{cache:"no-store"}).then(r=>r.json()).then(w=>{
  const n1=x=>(x*100).toFixed(1).replace(".",","),n0=x=>Math.round(x*100),b2=x=>x.toFixed(2).replace(".",","),b3=x=>(+x).toFixed(3).replace(".",","),dm=s=>fmtDay(s).slice(0,5)+"."+s.slice(0,4);
  let t="";
  if(w.factor){const f=w.factor;t+=`<h4>Faktor-ETFs</h4><div class="mute">Gleiche Fragen, andere Zuschnitte des Marktes. Alles in Euro, ${fmtDay(f.since)} bis ${fmtDay(f.until)}, inklusive Ausschüttungen.</div>
   <table class="pf"><tr><th>ETF</th><th>Rendite/Jahr</th><th>Rückgang</th><th>Beta</th></tr>${f.rows.map(r=>`<tr${r.key==="SPY"?' style="color:var(--spy)"':""}><td>${r.name}</td><td>${n1(r.cagr)} %</td><td>−${n0(r.mdd)} %</td><td>${b2(r.beta)}</td></tr>`).join("")}</table>
   <div class="mute">Beta: 1 = schwankt wie der S&amp;P 500. Aufnahmetest vom 18.11.2026: Kein Faktor-ETF erfüllt die Aufnahmeregeln. Tech lief seit 2015 am besten, ab dem Jahr 2000 mit 80 % Rückgang aber nicht. Nur zur Information, keine Empfehlung.</div>`}
  if(w.elite){const e=w.elite;t+=`<h4 style="margin-top:44px">Elite 6</h4><div class="mute">Einzelwerte, die beide messbaren Kriterien erfüllen: Beta unter 1,15 und mindestens 17 % Rendite pro Jahr über zehn Jahre. Rangfolge nach 10-Jahres-Rendite. Ausgeschieden: CME Group, Waste Management, Hermès (Rendite), Alphabet (Beta), ASML (zyklisch). Beobachtungsportfolio ohne Kapitaleinsatz, keine Empfehlung.</div>
   <table class="pf"><tr><th>Aktie</th><th>Beta</th><th>10 Jahre p. a.</th><th>vom Hoch</th></tr>${[...e.rows].sort((a,b)=>(b.cagr10??-9)-(a.cagr10??-9)).map((r,i)=>{if(r.missing)return`<tr><td>${r.name}</td><td colspan="2">Kurse fehlen</td></tr>`;const off=r.cagr10!=null&&r.claim!=null&&Math.abs(r.cagr10*100-r.claim)>3;
    return`<tr><td>${i+1}. ${r.name}<br><span class="mute" style="font-size:11.5px">${r.branch}</span></td><td>${r.beta==null?"–":b2(r.beta)}</td><td>${r.cagr10==null?"–":n1(r.cagr10)+" %"}</td><td>${r.dd==null?"–":(r.dd<0.005?"am Hoch":"−"+n1(r.dd)+" %")}</td></tr>`}).join("")}</table>
   <div class="mute">Beta und 10-Jahres-Rendite: Aufnahmewerte vom ${e.stand?fmtDay(e.stand):"–"}, eingefroren. Vom Hoch: aktueller Abstand zum Allzeithoch, täglich neu. Beta: 5 Jahre, täglich, in Euro gegen den S&amp;P 500. Rendite: Heimatwährung, inklusive Dividenden. Bruttomarge, Marktstellung, Zyklik, Verschuldung und Burggraben werden nicht automatisch geprüft.</div>`;
   if(e.back)t+=`<div class="mute" style="margin-top:10px">Rückblick ${fmtDay(e.back.since)} bis ${fmtDay(e.back.until)}, gleich gewichtet, in Euro: Elite 6 ${n1(e.back.elite.cagr)} % pro Jahr, Rückgang ${n0(e.back.elite.mdd)} %. S&amp;P 500 ${n1(e.back.spy.cagr)} %, Rückgang ${n0(e.back.spy.mdd)} %. <b>Einordnung:</b> Auswahlkriterium ist die nachgewiesene Entwicklung der letzten zehn Jahre, der Rückblick bestätigt dieses Kriterium. Einschränkung: Die Auswahl erfolgte 2026. Unternehmen, die 2016 vergleichbar aussahen und später scheiterten, sind nicht enthalten. Den Test nach vorn liefert das Schattenbuch.</div>`;
   const rows=(e.shadow.rows||[]).map(r=>({date:r.date,shadow:r.elite,hold:r.spy}));
   t+=`<h4 style="margin-top:34px">Schattenbuch Elite</h4><div class="pair"><div><b style="color:var(--gld)">${rows.length?b3(rows[rows.length-1].shadow):"1,000"}</b><span>Elite 6</span></div><div><b>${rows.length?b3(rows[rows.length-1].hold):"1,000"}</b><span>S&amp;P 500</span></div></div>${chart(rows,"Elite 6","S&P 500")}
   <div class="mute">Seit ${fmtDay(e.shadow.start)} gleich gewichtet, in Euro, Start = 1,00. Bewertung nach fünf Jahren (November 2031): bewährt bei mindestens 2 Prozentpunkten Mehrrendite pro Jahr gegenüber dem S&amp;P 500 ohne größeren Rückgang, gescheitert bei Rendite unter dem S&amp;P 500.</div>${rows.length?`<details><summary>Verlauf</summary><table><tr><th>Tag</th><th>Elite 6</th><th>S&amp;P 500</th><th>Abstand</th></tr>${rows.slice().reverse().slice(0,60).map(r=>{const d=(r.shadow-r.hold)*100;return`<tr><td>${fmtDay(r.date)}</td><td>${b3(r.shadow)}</td><td>${b3(r.hold)}</td><td style="color:${d>0?"var(--ok)":d<0?"var(--bad)":"var(--mute)"}">${(d>0?"+":d<0?"−":"")+Math.abs(d).toFixed(1).replace(".",",")} Pkt.</td></tr>`}).join("")}</table></details>`:""}`}
  if(t){const s=document.getElementById("watch");s.innerHTML=t;s.hidden=false}}).catch(()=>{});
 fetch("sparplan.json",{cache:"no-store"}).then(r=>r.json()).then(go).catch(()=>{const s=h.players.SPY;go({dd_ath:s.dd_ath??s.dd_high,thresh:-0.03,currency:"USD"})});
 fetch("indicators.json",{cache:"no-store"}).then(r=>r.json()).then(j=>{if(!j.indicators||!j.indicators.length)return;const L={gruen:"günstig/Chance",gelb:"mittel",rot:"teuer/Vorsicht"};
  const s=document.getElementById("ind");s.innerHTML=`<h4>Marktlage</h4>`+j.indicators.map(i=>`<div class="ind"><i class="${i.light||""}" title="${L[i.light]||"Info"}"></i><b>${i.name}</b><em>${i.value}</em><small>${i.pct!=null?`${i.higher==="teurer"?"Teurer":"Ängstlicher"} als an ${Math.round(i.pct*100)} % der Zeit seit ${i.since}. `:""}${i.text} <span style="opacity:.7">${i.note}</span></small></div>`).join("")+`<div class="mute" style="margin-top:8px">Nur zur Info. Die Indikatoren fließen erst in die Regeln ein, wenn sie einen Test bestanden haben.</div>`;s.hidden=false}).catch(()=>{});
 requestAnimationFrame(()=>requestAnimationFrame(()=>{document.querySelectorAll(".fill").forEach(e=>e.style.height=e.dataset.h+"%");document.querySelectorAll(".season i").forEach(e=>e.style.width=e.dataset.w+"%")}));
}).catch(()=>{document.querySelector(".stamp").textContent="Noch keine Daten. Der erste Lauf fehlt oder heartbeat.json ist nicht erreichbar."});
