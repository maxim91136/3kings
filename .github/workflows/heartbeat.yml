name: heartbeat
on:
  schedule:
    - cron: "30 0 * * 2-6"      # 00:30 UTC: US-Boerse und Bitcoin-Tag sind beendet (Di-Sa = Schluss Mo-Fr)
  workflow_dispatch:
permissions:
  contents: write
concurrency: heartbeat
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install numpy
      - run: python fetch_prices.py --out data/prices.csv
      - run: python heartbeat.py
      - run: python fetch_indicators.py || true
        timeout-minutes: 3
        continue-on-error: true
      - run: python indicators.py || true
      - run: python sparplan.py || true
      - run: python fetch_elite.py || true
        timeout-minutes: 6
        continue-on-error: true
      - run: python watch.py || true
      - run: python fetch_spx.py || true
        timeout-minutes: 3
        continue-on-error: true
      - run: python longchart.py || true
      - run: python fetch_spot.py || true
        timeout-minutes: 3
        continue-on-error: true
      - run: python assets.py || true
      - run: python notify.py
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Ergebnis committen (haelt das Repo aktiv)
        run: |
          git config user.name "3kings-heartbeat"
          git config user.email "heartbeat@users.noreply.github.com"
          cp REGELN.md site/REGELN.md; cp REGELN.en.md site/REGELN.en.md
          git add -A
          git diff --cached --quiet || git commit -m "heartbeat $(date -u +%F)"
          git push
