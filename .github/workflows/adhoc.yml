name: adhoc
on:
  workflow_dispatch:
    inputs:
      script:
        description: "Python-Skript mit Argumenten, nur Ausgabe"
        required: true
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -q numpy && python $SCRIPT
        env:
          SCRIPT: ${{ github.event.inputs.script }}
