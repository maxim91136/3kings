name: elitebank
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "screen (Screening erzwingen), retro (Start-Nachberechnung übernehmen), test SYMBOL, poll (Test-Antwort abholen)"
        default: poll
permissions:
  contents: write
concurrency: elitebank
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -q numpy
      - name: Bank
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MODE: ${{ github.event.inputs.mode || 'poll' }}
        run: |
          if [ "$MODE" = "screen" ]; then python elitescreen.py --force; elif [ "$MODE" = "neustart" ]; then python elitescreen.py --force && python elite_neustart.py --apply && python elitecheck.py && python watch.py; elif [ "$MODE" = "testall" ]; then python test_notify.py; elif [ "$MODE" = "retro" ]; then RETRO_HOW="Nachrechnung nach Wegfall des Unterbranchen-Ausschlusses: Saisonprüfungen 27.10. und 20.11.2026 bestanden" RETRO_HOW_EN="recalculation after removal of the sub-industry exclusion: season reviews Oct 27 and Nov 20, 2026 passed" python eliteretro.py --apply && python elitecheck.py && python watch.py; else python elite_bank.py $MODE; fi
      - name: Änderungen committen
        run: |
          git config user.name "3kings-elitebank"
          git config user.email "elitebank@users.noreply.github.com"
          git add -A data site REGELN.md REGELN.en.md
          git diff --cached --quiet || git commit -m "Elite-Bank $(date -u +%F)"
          for i in 1 2 3; do git pull -q --rebase origin main && git push && break; sleep 5; done
