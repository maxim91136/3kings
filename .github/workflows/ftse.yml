name: ftse
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency: ftse
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: { python-version: "3.12" }
      - run: python ftse.py
      - name: Ergebnis committen
        run: |
          git config user.name "3kings-heartbeat"
          git config user.email "heartbeat@users.noreply.github.com"
          git add site/ftse.json
          git diff --cached --quiet || git commit -m "FTSE-Test $(date -u +%F)"
          for i in 1 2 3; do git pull -q --rebase origin main && git push && break; sleep 5; done
