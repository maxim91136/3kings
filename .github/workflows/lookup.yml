name: lookup
on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "Yahoo-Symbol, z. B. AMD"
        required: true
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -q numpy && python lookup.py "$SYMBOL"
        env:
          SYMBOL: ${{ github.event.inputs.symbol }}
