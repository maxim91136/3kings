name: btclive
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -q numpy
      - run: python btclive.py
      - name: Committen
        run: |
          git config user.name "3kings-heartbeat"
          git config user.email "heartbeat@users.noreply.github.com"
          git add site/assets.json
          git diff --cached --quiet || git commit -m "bitcoin $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
