name: telegram
on:
  push:
    branches: [main]
    paths: ["site/news.json", "site/reports.json"]
  workflow_dispatch:
    inputs:
      mode:
        description: "send, setup (zeigt Chat-IDs) oder test (sendet letzte News erneut)"
        default: send
permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency: telegram
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: { python-version: "3.12" }
      - run: |
          if [ "$MODE" = "send" ] || [ -z "$MODE" ]; then python tg.py; else python tg.py "$MODE"; fi
        env:
          MODE: ${{ github.event.inputs.mode }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Gesendet merken
        if: github.event.inputs.mode != 'setup' && github.event.inputs.mode != 'test'
        run: |
          git config user.name "3kings-telegram"
          git config user.email "telegram@users.noreply.github.com"
          git add data/tg_sent.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "telegram gesendet" && git pull --rebase && git push)
